# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    location / {
        return 301 https://localhost$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localhost;

    # Certificado OpenSSL
    ssl_certificate /home/angel/Git/pruebasTFM/blablaUCMWS/blablaUCM/certs/cert.pem;
    ssl_certificate_key /home/angel/Git/pruebasTFM/blablaUCMWS/blablaUCM/certs/key.pem;

    # SSL config (puedes dejarlo igual)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;

    # OPCIONAL: en local puedes comentar esto si da problemas
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Logs
    access_log /var/log/nginx/blablaUCM_access.log;
    error_log /var/log/nginx/blablaUCM_error.log;

    client_max_body_size 100M;

    # Static
    location /static/ {
        alias /home/angel/Git/pruebasTFM/blablaUCMWS/blablaUCM/staticfiles/;
    }

    # Media
    location /media/ {
        alias /home/angel/Git/pruebasTFM/blablaUCMWS/blablaUCM/media/;
    }

    # Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # CLAVE para Django HTTPS
        proxy_set_header X-Forwarded-Proto https;
    }
}



