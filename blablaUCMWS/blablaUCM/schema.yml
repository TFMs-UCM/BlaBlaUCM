openapi: 3.0.3
info:
  title: ''
  version: 0.0.0
paths:
  /api/v1/auth/google/login/:
    post:
      operationId: auth_google_login_create
      description: |-
        Login con Google para usuarios ya registrados.
        Recibe id_token de Google y devuelve JWT si el usuario existe.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/google/register/:
    post:
      operationId: auth_google_register_create
      description: |-
        Registro con Google. Recibe id_token, el nombre de usuario y el tipo de usuario, opcionalmente el segundo apellido.
        Crea el usuario y devuelve el token JWT con los datos del usuario si el registro es exitoso, o error en caso contrario.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Endpoint para pedir el refresh token, no requiere de autenticacion
        previa.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenRefresh'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenRefresh'
          description: ''
  /api/v1/chats/:
    get:
      operationId: chats_retrieve
      description: |-
        Endpoint GET /chats/
        Se le pasa como parametro opcional archived=true para obtener solo los chats archivados.
        Devuelve los chats de los viajes en los que participa el usuario
      tags:
      - chats
      responses:
        '200':
          description: No response body
  /api/v1/chats/{id}/:
    delete:
      operationId: chats_destroy
      description: |-
        Endpoint DELETE /chats/{travel_id}/
        El usuario sale del chat de forma permanente.
        El conductor solo puede salir del chat cuando el viaje ha finalizado.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - chats
      responses:
        '204':
          description: No response body
  /api/v1/chats/{id}/archive/:
    post:
      operationId: chats_archive_create
      description: |-
        Endpoint POST /chats/{travel_id}/archive/
        Archiva el chat que mueve a la seccion de archivados
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - chats
      responses:
        '200':
          description: No response body
  /api/v1/chats/{id}/messages/:
    get:
      operationId: chats_messages_retrieve
      description: |-
        Endpoint GET /chats/{travel_id}/messages/
        Devuelve el historial de mensajes del chat del viaje indicado y si se pueden enviar mensajes
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - chats
      responses:
        '200':
          description: No response body
  /api/v1/chats/{id}/mute/:
    post:
      operationId: chats_mute_create
      description: |-
        Endpoint POST /chats/{travel_id}/mute/
        Se pasa en el body el parametro: {"muted": true|false} para indicar si se quiere silenciar o reactivar las notificaciones
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - chats
      responses:
        '200':
          description: No response body
  /api/v1/chats/{id}/unarchive/:
    post:
      operationId: chats_unarchive_create
      description: |-
        Endpoint POST /chats/{travel_id}/unarchive/
        Desarchiva el chat que lo devuelve a la lista principal.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - chats
      responses:
        '200':
          description: No response body
  /api/v1/criteria/:
    get:
      operationId: criteria_list
      description: |-
        Clase para aplicar un soft delete, es decir que no se elimine de bbdd el elemento, si no que se marque como borrado,
        ademas, se sobreescribe el queryset para que por defecto no saque los elementos marcados como borrados
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - criteria
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCriteriaList'
          description: ''
