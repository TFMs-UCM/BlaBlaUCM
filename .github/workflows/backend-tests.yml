# Integracion continua del backend Django (blablaUCMWS/blablaUCM)
# Levanta un contenedor Postgres+PostGIS efimero (el mismo papel que cumple
# docker-compose.test.yml en local) y ejecuta la suite completa contra el
name: Backend tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# El proyecto Django no esta en la raiz del repositorio (que contiene tambien
# la app Flutter), asi que todos los run se ejecutan dentro de su carpeta
defaults:
  run:
    working-directory: blablaUCMWS/blablaUCM

# Un push nuevo sobre la misma rama cancela la ejecucion anterior en curso
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Django test suite (PostGIS)
    runs-on: ubuntu-24.04

    # Necesario para poder escribir el comentario de cobertura en el PR
    permissions:
      contents: read
      pull-requests: write

    services:
      db-test:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: blablaucm_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d blablaucm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Cobertura minima exigida
      COVERAGE_MIN: "85"

      # --- BBDD de test (servicio db-test, puerto 5433 del runner)
      DB_ENGINE: django.contrib.gis.db.backends.postgis
      DB_NAME: blablaucm_test
      DB_USER: test
      DB_PASSWORD: test
      DB_HOST: localhost
      DB_PORT: 5433
      # Django clona la BBDD de test desde esta plantilla 
      DB_TEST_TEMPLATE: template_postgis

      # --- Django ---
      SECRET_KEY: clave-solo-para-tests
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      MEDIA_PATH: media
      LOGS_PATH: logs
      LOGS_NAME: BlaBlaUCM_ci

      # --- Email / Google / Firebase: se mockean en los tests
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      EMAIL_HOST: localhost
      EMAIL_PORT: "25"
      EMAIL_USE_TLS: "False"
      EMAIL_HOST_USER: test@example.com
      EMAIL_HOST_PASSWORD: dummy
      GOOGLE_CLIENT_ID: dummy-client-id
      GOOGLE_DEFAULT_USER_TYPE: std
      FIREBASE_CREDENTIALS_PATH: /tmp/firebase-dummy.json

      # --- Channels: capa en memoria, sin Redis
      REDIS_URL: ""

      # --- Las pruebas encadenan peticiones a proposito, sin throttling
      THROTTLE_ENABLED: "False"

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # GeoDjango localiza GDAL/GEOS por ctypes en Linux
      # pero las librerias de sistema no vienen en el runner: hay que instalarlas.
      - name: Instalar GDAL/GEOS/PROJ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            blablaUCMWS/blablaUCM/requirements.txt
            blablaUCMWS/blablaUCM/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Comprobaciones de Django
        run: python manage.py check

      - name: El esquema versionado esta al dia
        run: |
          python manage.py spectacular --file /tmp/schema.check.yml
          diff -u schema.yml /tmp/schema.check.yml

      - name: Ejecutar la suite con cobertura
        run: |
          coverage run manage.py test \
            --testrunner xmlrunner.extra.djangotestrunner.XMLTestRunner \
            --noinput --verbosity 2

      - name: Generar informes de cobertura
        if: always()
        run: |
          coverage report
          coverage html
          coverage xml
          coverage json -o coverage.json

      # Resumen en Markdown que se escribe en la pagina del run y se guarda
      # para reutilizarlo como comentario del pull request.
      - name: Resumen del run
        if: always()
        run: |
          python scripts/ci_report.py --min "$COVERAGE_MIN" > informe-ci.md
          cat informe-ci.md >> "$GITHUB_STEP_SUMMARY"

      # Un unico comentario por PR que se va reescribiendo en cada push, en
      # lugar de acumular uno nuevo por ejecucion.
      - name: Comentar el informe en el pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marca = '<!-- informe-backend-ci -->';
            const cuerpo = marca + '\n' + fs.readFileSync(
              'blablaUCMWS/blablaUCM/informe-ci.md', 'utf8');

            const { data: comentarios } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previo = comentarios.find(
              c => c.user.type === 'Bot' && c.body.includes(marca));

            if (previo) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previo.id,
                body: cuerpo,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: cuerpo,
              });
            }

      # Informe HTML navegable, XML de cobertura, JUnit y logs, descargables desde la pagina del run.
      - name: Subir informes como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-backend
          path: |
            blablaUCMWS/blablaUCM/htmlcov/
            blablaUCMWS/blablaUCM/coverage.xml
            blablaUCMWS/blablaUCM/test-results/
            blablaUCMWS/blablaUCM/logs/
          if-no-files-found: ignore
          retention-days: 14

      # Ultimo paso a proposito: si la cobertura baja del minimo el job falla,
      # pero solo despues de haber publicado resumen, comentario y artefactos.
      - name: Exigir cobertura minima
        if: always()
        run: coverage report --fail-under="$COVERAGE_MIN"
